
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>postCrud</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
    	    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
            
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-2 mb-4">
                <div class="card mt-3">
                    <div class="card-body">
                        <form  id="postForm">
                            <div class="form-group">

                                <label for="title"><b>Enter Title</b></label>
                                <input type="text" class="form-control" id="title">
                            </div>
                              <div class="form-group">
                                <label for="body"><b>Enter Content</b></label>
                                <textarea type="text"  rows="4"   class="form-control" id="body"></textarea>
                            </div>
                              <div class="form-group">
                                <label for="userId"><b>Enter UserId</b></label>
                                <select class="form-control" placeholder="USERID" id="userId">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>

                                </select>
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-sm btn-block" id="addpostBtn">ADD POST</button>
                            <button type="button" class="btn btn-outline-success btn-sm btn-block d-none" id="updatepostBtn">UPDATE POST</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row" id="postContainer">
        <!-- <div class="col-md-4"> 
             <div class="card">
                <div class="card-header">
                    <h3>gana</h3>
                </div>
                <div class="card-body">
                    <p>oiuhgffgiopoihgcevfjvoiegvfhvopojh</p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <button class="btn btn-primary btn-sm">EDIT</button>
                    <button class="btn btn-danger btn-sm">REMOVE</button>
                </div>
            </div>
        </div> -->

    <div class="spinner" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loding...</span>
        </div>
    </div>
    <script src="./assets/js/app.js"></script>
</body>
</html>
